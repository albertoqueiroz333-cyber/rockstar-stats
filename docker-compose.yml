services:
  stats_app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - stats_database
    volumes:
      - ./app:/app
    environment:
      DATABASE_URL: postgresql://app_user:app_password@stats_database:5432/app_db
  stats_database:
    image: postgres
    volumes:
      - pgdata:/var/lib/postgresql/
    environment:
      POSTGRES_USER: app_user
      POSTGRES_DB: app_db
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"

volumes:
  pgdata:
