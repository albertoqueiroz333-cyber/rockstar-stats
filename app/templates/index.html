<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Meu Site{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
    <!-- Cabeçalho -->
    <header>
        <nav>
            <h1><a href="/">{{ site_nome | default("Meu Portal") }}</a></h1>
            <ul>
                <li><a href="/">Início</a></li>
                <li><a href="/produtos">Produtos</a></li>
                <li><a href="/contato">Contato</a></li>
            </ul>
        </nav>
    </header>

    <!-- Conteúdo Dinâmico -->
    <main class="container">
        {% block content %}
        <!-- O conteúdo das páginas filhas será injetado aqui -->
        {% endblock %}
    </main>

    <!-- Rodapé -->
    <footer>
        <p>&copy; 2026 {{ site_nome }}. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
